[platformio]
default_envs = server


; =========================
; SERVER (ESP32-1)
; =========================
[env:server]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200

build_src_filter =
    +<server/*>
    -<indicator/*>
    -<../experiments/*>

lib_deps =
    madhephaestus/ESP32Servo@3.1.3



; =========================
; INDICATOR (ESP32-2)
; =========================
[env:indicator]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = /dev/cu.usbserial-1110
monitor_port = /dev/cu.usbserial-1110
monitor_speed = 115200

build_src_filter =
    +<indicator/*>
    -<server/*>
    -<../experiments/*>

lib_deps =
    madhephaestus/ESP32Servo@3.1.3



; =========================
; EXPERIMENT
; =========================
[env:experiment]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200

build_flags =
    -DEXPERIMENT_FOLDER=ultrasonic

build_src_filter =
    +<../experiments/${EXPERIMENT_FOLDER}/*>
    -<server/*>
    -<indicator/*>

lib_deps =
    madhephaestus/ESP32Servo@3.1.3
